name: Verify Rapigents

on:
  push:
    branches:
      - arena/01a0d281-wesbite
  pull_request:
    branches:
      - arena/01a0d281-wesbite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Build production app
        run: npm run build
