name: Repair npm lockfile

on:
  push:
    branches:
      - arena/01a0d281-wesbite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-npm-lockfile-arena
  cancel-in-progress: false

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Rapigents feature branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0d281-wesbite
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix npm lockfile synchronization"
          git push origin HEAD:arena/01a0d281-wesbite
